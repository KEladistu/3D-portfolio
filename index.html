<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kenneth Eladistu — a cabin in the woods</title>
    <meta name="description" content="Portfolio of Kenneth Eladistu — robotics engineer and full-stack developer (Django, React, Three.js, ROS2, Azure)." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="loader"><p>lighting the fire…</p></div>

    <canvas id="webgl"></canvas>
    <div id="labels"></div>

    <header class="top">
      <button class="name" data-go="home">
        <strong id="name"></strong>
        <span id="role"></span>
      </button>
      <nav id="nav"></nav>
    </header>

    <button id="exit" class="exit">←&nbsp; Step outside</button>
    <div id="fade"></div>
    <button id="sound" class="sound" aria-pressed="false">♪ sound off</button>
    <p class="hint">Drag to look around · click things to explore</p>

    <aside id="panel" aria-hidden="true">
      <button id="close" aria-label="Close">←&nbsp; back</button>
      <div id="panel-body"></div>
    </aside>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
